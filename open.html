<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="robots" content="noindex, nofollow">
	<meta name="theme-color" content="#050507">
	<title>PULLS 개봉 데모</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27none%27 stroke=%27%23111%27 stroke-width=%276%27/%3E%3C/svg%3E">
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
	<link rel="stylesheet" href="css/tokens.css?v=02a6f312">
	<link rel="stylesheet" href="css/reveal.css?v=49f64096">
</head>
<body class="reveal">

	<!-- 1. 시작 : 탭해서 개봉 (자동재생 정책 + 기대감) -->
	<section class="rv-start" id="start">
		<span class="brand rv-start__brand">PULLS</span>
		<div class="rv-start__pack" id="startPack">
			<div class="rv-pack rv-pack--idle"><div class="rv-pack__top"></div><div class="rv-pack__body"><i class="rv-pack__mark"></i><b>BOOSTER PACK</b></div></div>
		</div>
		<p class="rv-start__title" id="startTitle">팩을 눌러 개봉</p>
		<p class="rv-start__desc" id="startDesc">결과는 개봉이 끝나면 공개됩니다</p>
	</section>

	<!-- 2. 빌드업 영상 (등급별 미리 렌더링) -->
	<section class="rv-video" id="videoStage" hidden>
		<video id="videoBg" class="rv-video__bg" playsinline muted preload="auto" aria-hidden="true"></video>
		<video id="video" playsinline muted preload="auto"></video>
		<video id="videoWait" playsinline muted preload="auto" hidden></video>
		<video id="videoOpen" playsinline muted preload="auto" hidden></video>
		<div class="rv-video__glow"></div>
		<p class="rv-video__hint"><span class="rv-hint__dot"></span>탭해서 열기</p>
		<button type="button" class="rv-skip" id="btnSkip">건너뛰기</button>
	</section>

	<!-- 3. 공개 : 흰 화면에서 카드가 슬리브를 찢고 올라옴 -->
	<section class="rv-stage" id="stage" hidden>
		<div class="rv-glow" id="glow"></div>
		<div class="rv-scene" id="scene">
			<div class="rv-card" id="card">
				<div class="rv-card__inner" id="cardInner">
					<div class="rv-card__front">
						<img id="cardImg" alt="">
						<div class="rv-card__holo"></div>
						<div class="rv-card__glare"></div>
					</div>
					<div class="rv-card__back"><i class="rv-pack__mark"></i><span>PULLS</span></div>
				</div>
			</div>
			<div class="rv-sleeve" id="sleeve">
				<div class="rv-sleeve__tear" id="tear"></div>
				<div class="rv-sleeve__body"><i class="rv-pack__mark"></i><b>BOOSTER PACK</b></div>
			</div>
			<p class="rv-hint" id="hint"><span class="rv-hint__dot"></span>탭해서 카드 꺼내기</p>
		</div>
		<div class="rv-info" id="info">
			<span class="rv-grade" id="grade"></span>
			<h1 class="rv-name" id="name"></h1>
			<p class="rv-meta" id="meta"></p>
			<div class="rv-actions">
				<button type="button" class="btn btn--primary" id="btnAgain">다시 보기</button>
				<a class="btn btn--ghost" id="btnOrders" href="./" target="_top">팩 다시 고르기</a>
			</div>
		</div>
	</section>

	<script src="js/config.js?v=fe29d76d"></script>
	<script>window.TCG_CONFIG.reveal = { videoBase: 'video/', videoSuffix: '.mp4', defaultStyle: 'anime', capsules: { anime: { glow: { x: .5, y: .77, r: .42 }, intro: 'video/cap2-A.mp4', wait: 'video/cap2-W.mp4', open: { 1: 'video/cap2-B6.mp4', 2: 'video/cap2-B6.mp4', 3: 'video/cap2-B6.mp4', 4: 'video/cap2-B6.mp4', 5: 'video/cap2-B6.mp4', 6: 'video/cap2-B6.mp4' } }, cinematic: { glow: { x: .5, y: .5, r: .5 }, intro: 'video/cap-A.mp4', wait: 'video/cap-W.mp4', open: { 5: 'video/cap-B5.mp4', 6: 'video/cap-B6.mp4' } } } };</script>
	<script src="js/reveal.js?v=a173c328"></script>
</body>
</html>
