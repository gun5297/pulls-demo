<body class="frame">
	<a class="fr-back" href="./" id="frBack">← 돌아가기</a>
	<div class="ph">
		<div class="ph__notch"></div>
		<div class="ph__screen"><iframe id="screen" title="개봉 화면" allow="autoplay"></iframe></div>
	</div>
	<p class="fr-note">모바일 개봉 화면을 PC 에서 그대로 미리보기 · 폰에서는 전체 화면으로 재생됩니다</p>
	<script>
		(function () {
			var src = decodeURIComponent(location.hash.slice(1) || '') || 'open.html';
			if (!/^open\.html/.test(src)) src = 'open.html';
			document.getElementById('screen').src = src;
				var m = /[?&]next=([^&]+)/.exec(src); if (m) document.getElementById('frBack').href = decodeURIComponent(m[1]);
		})();
	</script>
</body>
