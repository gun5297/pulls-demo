<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>PULLS 개봉 데모</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/demo.css">
</head>
<body class="frame">
	<a class="fr-back" href="./">← 팩 다시 고르기</a>
	<div class="ph">
		<div class="ph__notch"></div>
		<div class="ph__screen"><iframe id="screen" title="개봉 화면" allow="autoplay"></iframe></div>
	</div>
	<p class="fr-note">모바일 화면 그대로 보여주는 PC 미리보기 · 폰에서 열면 전체 화면으로 재생됩니다</p>
	<script>
		(function () {
			var src = decodeURIComponent(location.hash.slice(1) || '') || 'open.html';
			if (!/^open\.html/.test(src)) src = 'open.html';
			document.getElementById('screen').src = src;
		})();
	</script>
</body>
</html>
